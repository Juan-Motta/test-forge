[project]
name = "voice-eval"
version = "0.1.0"
description = "Automated spoken-conversation probe and evaluator engine for realtime voice agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["websockets>=15", "openai>=1.50"]

[project.scripts]
voice-probe = "voice_eval.probe:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_eval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["macos_say: requires the macOS `say` command"]
