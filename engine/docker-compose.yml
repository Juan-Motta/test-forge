# Development database only. Credentials are local placeholders, never production values.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: voice_eval
      POSTGRES_PASSWORD: voice_eval
      POSTGRES_DB: voice_eval
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_eval -d voice_eval"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
