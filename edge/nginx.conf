# voice-eval edge (NGINX, unprivileged). The browser's only entry point:
#
#   /api/, /api  -> backend:8000   (FastAPI; trusts X-Forwarded-For only from this container)
#   everything   -> frontend:3000  (Next.js)
#
# WebSocket upgrades pass through on every route. The live run streams (`/api/runs/live`,
# `/api/runs/<id>/live`) get a 1 h idle limit instead of 300 s.
#
# Client addresses: this is the first hop, so $remote_addr is the real peer. Every
# X-Forwarded-* header the client sent is discarded and rebuilt from that view; nothing a client
# sends can choose the address the backend's login throttle counts. Behind another reverse proxy
# or TLS terminator, see "Behind another proxy" in the root README before changing this.

worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # The root filesystem is read-only; /tmp is a tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    log_format edge '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_user_agent" upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout edge;

    # Deployment-specific settings, empty by default. compose.dokploy.yaml mounts
    # trusted-proxy.conf here so the client address is recovered from Traefik only.
    include /etc/nginx/edge.d/*.conf;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65s;

    # Requests: bodies are small JSON documents today.
    client_max_body_size  10m;
    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          60s;

    # Docker's embedded DNS: upstream addresses follow container restarts without reloading.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream backend {
        zone backend 64k;
        server backend:8000 resolve;
        keepalive 16;
        # Below the 5 s idle timeout of uvicorn and Node, so nginx never reuses a socket they closed.
        keepalive_timeout 4s;
    }

    upstream frontend {
        zone frontend 64k;
        server frontend:3000 resolve;
        keepalive 16;
        # Below the 5 s idle timeout of uvicorn and Node, so nginx never reuses a socket they closed.
        keepalive_timeout 4s;
    }

    # WebSocket upgrades pass through; plain requests keep upstream connections alive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 8080 default_server;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Overwrite (never append to) every forwarding header with this hop's own view.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        # Not rebuilt here, so a client must not be able to set them either.
        proxy_set_header X-Forwarded-Port  "";
        proxy_set_header Forwarded         "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # Also the idle limit of an upgraded (WebSocket) connection.
        proxy_read_timeout    300s;

        proxy_hide_header X-Powered-By;

        location = /api {
            proxy_pass http://backend;
        }

        location /api/ {
            proxy_pass http://backend;
        }

        # Live run streams (WebSocket, see the backend README). A run lasts up to 30 min and a
        # monitor may stay open longer; the backend also pings every 20 s. Only these routes get
        # the longer limits; every other route keeps the server defaults above.
        location ~ ^/api/runs/([^/]+/)?live$ {
            proxy_pass http://backend;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            # Next.js streams rendered pages; pass chunks through as they arrive.
            proxy_buffering off;
            proxy_pass http://frontend;
        }
    }

    # Container health check only: loopback, never published.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }
}
